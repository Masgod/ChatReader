[project]
name = "chatreader"
version = "0.1.0"
description = "Windows tray app that reads Twitch and YouTube chat aloud with Kokoro TTS"
requires-python = ">=3.11"
dependencies = [
    "kokoro-onnx",
    "pytchat",
    "websockets",
    "fastapi",
    "uvicorn",
    "pystray",
    "Pillow",
    "tomli-w",
    "fasttext-predict>=0.9.2.4",
]

[project.scripts]
chatreader = "chatreader.main:main"

[project.gui-scripts]
chatreader-tray = "chatreader.main:main"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatreader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs downloaded Kokoro model files in ./voices"]
