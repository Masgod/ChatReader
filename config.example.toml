# Copy to config.toml (the app creates it on first run if missing).

# Twitch channel name, without the '#'. Empty disables Twitch.
twitch_channel = ""

# YouTube live video ID or URL. Empty disables YouTube.
youtube_video_id = ""

# Kokoro voice for Portuguese messages (downloaded on first run).
voice_pt = "pf_dora"

# Kokoro voice for English messages.
voice_en = "af_heart"

# Language used when detection is unsure or the message is very short: "pt" or "en".
default_lang = "pt"

# Maximum messages waiting to be spoken. When full, the oldest waiting message is dropped.
queue_size = 20

# Messages longer than this are truncated before speaking.
max_chars = 200

# Say "<user> disse:" / "<user> says:" before the text. false reads only the text.
announce_user = true

# Port of the local overlay server (bound to 127.0.0.1 only).
port = 8765

# Start the app automatically when Windows starts.
start_with_windows = false

# Chat users whose messages are never read (bots).
ignored_users = ["nightbot", "streamelements", "streamlabs", "moobot"]

# Seconds during which the same user's repeated message is skipped (rapid-fire repeats).
repeat_window = 5

# Write debug-level entries to the log file (errors only otherwise).
debug = false

# Speech speed, 0.8 to 1.4.
speed = 1.0

# CPU threads used for speech, 1 to 8. Needs a restart.
cpu_threads = 2

# YouTube channel (@handle or UC... ID) to find the live stream automatically.
youtube_channel = ""

# Only read messages from these roles ("sub", "vip", "mod"). Empty = read everyone.
twitch_roles = []
youtube_roles = []

# Skip the same text from anyone within this many seconds (0 = off, max 600).
repeat_seconds = 30

# Give each chat user their own voice.
per_user_voices = true

# Chat overlay (/chat-overlay): theme folder name under themes/, or "default".
overlay_theme = "default"
# top-left, top-right, middle-left, middle-right, bottom-left or bottom-right.
overlay_position = "bottom-left"
# Bubbles on screen at once (1-10) and seconds they stay after the voice ends (0-30).
overlay_max_bubbles = 4
overlay_hold_seconds = 4
# Size of everything in the overlay, in percent (50-200).
overlay_scale = 100
# !random in chat gives the viewer a new hero. The wait doubles on each use in a row.
random_cooldown_base = 10   # per viewer, seconds
random_cooldown_max = 300
random_global_base = 2      # whole chat, seconds
random_global_max = 60
# Optional: Client ID of your app at dev.twitch.tv/console, so ChatReader can answer !random and !hero in your Twitch chat.
twitch_client_id = ""
