<!doctype html>
<meta charset="utf-8">
<title>chatreader overlay</title>
<script>
let ws, audio = null;

function finish() {
  if (audio) {
    audio.pause();
    URL.revokeObjectURL(audio.src);
    audio = null;
  }
  if (ws && ws.readyState === WebSocket.OPEN) ws.send("done");
}

function connect() {
  ws = new WebSocket("ws://" + location.host + "/ws");
  ws.binaryType = "arraybuffer";
  ws.onmessage = (e) => {
    if (typeof e.data === "string") {
      if (e.data === "stop") finish();
      return;
    }
    audio = new Audio(URL.createObjectURL(new Blob([e.data], { type: "audio/wav" })));
    audio.onended = audio.onerror = finish;
    audio.play().catch(finish);
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
